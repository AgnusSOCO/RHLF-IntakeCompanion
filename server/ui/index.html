<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RHLF Intake Assistant</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #11161d;
    --panel-2: #161d27;
    --border: #232c38;
    --text: #e8eef5;
    --muted: #8b98a8;
    --caller: #4c8dff;
    --agent: #34c98e;
    --objection: #f0a844;
    --ai: #b07af0;
    --question: #6ea8fe;
    --escalate: #f4645f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 14px;
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    background: linear-gradient(180deg, #141b25, #10161f);
    border-bottom: 1px solid var(--border);
  }
  .logo {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, #b98a2f, #e8c15a);
    color: #10161f; font-weight: 800; font-size: 12px;
    display: grid; place-items: center; letter-spacing: .5px;
  }
  .brand { font-weight: 650; font-size: 14px; }
  .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
  .spacer { flex: 1; }
  .conn {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
  .dot.on { background: var(--agent); box-shadow: 0 0 6px var(--agent); }
  .dot.off { background: #555; }
  #pauseBtn {
    padding: 6px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-size: 12px; font-weight: 600;
  }
  #pauseBtn:hover { border-color: #3a4655; }
  #pauseBtn.paused { background: #3a1d1d; border-color: var(--escalate); color: var(--escalate); }

  /* ---------- call banner ---------- */
  #callBanner {
    display: none;
    padding: 8px 14px;
    background: linear-gradient(90deg, rgba(52,201,142,.12), rgba(76,141,255,.08));
    border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--agent); font-weight: 600;
    align-items: center; gap: 10px;
  }
  #callBanner.live { display: flex; }
  #callBanner .num { color: var(--text); font-weight: 500; }
  #callBanner .timer { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--escalate); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

  /* ---------- guidance ---------- */
  #assistLabel {
    padding: 10px 14px 4px;
    font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
    color: var(--muted); text-transform: uppercase;
  }
  #assist { padding: 0 14px; max-height: 46%; overflow-y: auto; }
  #assistEmpty {
    border: 1px dashed var(--border); border-radius: 10px;
    color: var(--muted); font-size: 12px; padding: 14px;
    text-align: center; margin: 4px 0 8px;
  }

  .card {
    border: 1px solid var(--border);
    border-left: 4px solid var(--objection);
    background: var(--panel-2);
    border-radius: 10px;
    padding: 12px 14px;
    margin: 8px 0;
    animation: slideIn .25s ease;
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }
  .card.faq { border-left-color: var(--agent); }
  .card.ai { border-left-color: var(--ai); }
  .card.question { border-left-color: var(--question); }
  .card.escalate { border-left-color: var(--escalate); background: #1d1315; }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .badge {
    font-size: 10px; font-weight: 800; letter-spacing: 1px;
    padding: 3px 7px; border-radius: 5px; text-transform: uppercase;
    background: rgba(240,168,68,.15); color: var(--objection);
  }
  .card.faq .badge { background: rgba(52,201,142,.15); color: var(--agent); }
  .card.ai .badge { background: rgba(176,122,240,.15); color: var(--ai); }
  .card.question .badge { background: rgba(110,168,254,.15); color: var(--question); }
  .card.escalate .badge.esc { background: rgba(244,100,95,.18); color: var(--escalate); }
  .card h3 { margin: 0; font-size: 13px; font-weight: 650; flex: 1; }
  .card .lang { font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
  .card .dismiss {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 15px; line-height: 1; padding: 2px 4px;
  }
  .card .dismiss:hover { color: var(--text); }
  .say-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-top: 10px; }
  .say { font-size: 14.5px; line-height: 1.5; margin-top: 3px; color: #f4f7fa; }
  .ask { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .ask b { color: var(--text); font-weight: 600; }
  .matched { margin-top: 8px; font-size: 11px; color: #5f6b7a; font-style: italic; }
  .card .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; }
  .card .actions { display: flex; gap: 6px; }
  .copy, .fb {
    border: 1px solid var(--border); background: var(--panel); color: var(--muted);
    font-size: 11px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
  }
  .copy:hover, .fb:hover { color: var(--text); border-color: #3a4655; }
  .fb.helpful.on { color: var(--agent); border-color: var(--agent); }
  .fb.unhelpful.on { color: var(--escalate); border-color: var(--escalate); }
  .card.stale { opacity: .45; }
  .noanswer { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 6px; }

  .thinking {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; margin: 8px 0;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--panel-2); color: var(--muted); font-size: 12.5px;
  }
  .shimmer { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--ai); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }

  /* ---------- transcript ---------- */
  #txLabel {
    padding: 8px 14px 4px;
    font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
    color: var(--muted); text-transform: uppercase;
    border-top: 1px solid var(--border);
  }
  #transcript { flex: 1; overflow-y: auto; padding: 6px 14px 14px; scroll-behavior: smooth; }
  #txEmpty { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 30px; }
  #jump {
    position: fixed; bottom: 46px; left: 50%; transform: translateX(-50%);
    display: none; padding: 5px 14px; border-radius: 14px; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--muted); font-size: 11.5px; z-index: 5;
  }
  .msg { display: flex; margin: 8px 0; gap: 8px; }
  .msg.agent { flex-direction: row-reverse; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    font-size: 10px; font-weight: 800;
  }
  .msg.caller .avatar { background: rgba(76,141,255,.2); color: var(--caller); }
  .msg.agent .avatar { background: rgba(52,201,142,.2); color: var(--agent); }
  .bubble {
    max-width: 78%; padding: 8px 12px; border-radius: 12px;
    font-size: 13.5px; line-height: 1.45;
  }
  .msg.caller .bubble { background: #1a2331; border-top-left-radius: 3px; }
  .msg.agent .bubble { background: #14261f; border-top-right-radius: 3px; }
  .meta { font-size: 10px; color: #5f6b7a; margin: 0 34px -4px; }
  .msg.agent .meta { text-align: right; }
  .interim .bubble { opacity: .55; font-style: italic; }
  .es-tag { font-size: 9px; color: var(--muted); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; margin-left: 6px; }

  /* ---------- footer ---------- */
  footer {
    padding: 7px 14px; border-top: 1px solid var(--border);
    font-size: 10.5px; color: #55606e; text-align: center;
  }
</style>
</head>
<body>
<header>
  <div class="logo">RH</div>
  <div class="brand">Intake Assistant<small>Richard Harris Law Firm</small></div>
  <div class="spacer"></div>
  <div class="conn"><span id="connDot" class="dot off"></span><span id="connText">offline</span></div>
  <button id="pauseBtn">Pause</button>
</header>

<div id="callBanner"><span class="pulse"></span>LIVE CALL <span class="num" id="callerNum"></span><span class="timer" id="timer">0:00</span></div>

<div id="assistLabel">Guidance for you</div>
<div id="assist"><div id="assistEmpty">Approved responses and answers will appear here during the call.</div></div>

<div id="txLabel">Live transcript</div>
<div id="transcript"><div id="txEmpty">Waiting for a call…</div></div>
<button id="jump">↓ Jump to latest</button>

<footer>Guidance is firm-approved or AI-drafted — not legal advice. You are not an attorney.</footer>

<script>
const params = new URLSearchParams(location.search);
const extensionId = params.get("extensionId");
const token = params.get("token");
const connDot = document.getElementById("connDot");
const connText = document.getElementById("connText");
const assistEl = document.getElementById("assist");
const transcriptEl = document.getElementById("transcript");
const pauseBtn = document.getElementById("pauseBtn");
const callBanner = document.getElementById("callBanner");
const callerNum = document.getElementById("callerNum");
const timerEl = document.getElementById("timer");

if (!extensionId || !token) {
  connText.textContent = "missing ?extensionId= & ?token=";
  throw new Error("missing params");
}

const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ui?extensionId=${extensionId}&token=${token}`);
let interim = {};           // speaker -> element
let paused = false;
let callStartTs = null, timerInt = null;
let thinkingEl = null;
let txHasContent = false;
const liveCardIds = new Set();   // dedupe repeat suggestions

const KIND = { objection: "Objection", faq: "FAQ", question: "Question", ai: "AI assist" };
const CARD_STALE_MS = 90_000, CARD_REMOVE_MS = 150_000;

ws.onopen = () => { connDot.className = "dot on"; connText.textContent = `ext ${extensionId}`; };
ws.onclose = () => { connDot.className = "dot off"; connText.textContent = "offline"; endCallUI(); };

pauseBtn.onclick = () => {
  paused = !paused;
  pauseBtn.classList.toggle("paused", paused);
  pauseBtn.textContent = paused ? "Paused" : "Pause";
  ws.send(JSON.stringify({ type: "pause", paused }));
};

ws.onmessage = (ev) => {
  const m = JSON.parse(ev.data);
  switch (m.type) {
    case "callStart": startCallUI(m); break;
    case "callEnd": endCallUI(); break;
    case "state": if (typeof m.paused === "boolean") setPaused(m.paused); break;
    case "transcript": renderTranscript(m); break;
    case "suggestion": renderSuggestion(m); break;
    case "assist-thinking": showThinking(); break;
    case "paused": setPaused(m.paused); break;
    case "stt-error": connText.textContent = "STT: " + m.message; break;
  }
};

function startCallUI(m) {
  callBanner.classList.add("live");
  callerNum.textContent = m.callerNumber || "";
  callStartTs = Date.now();
  clearInterval(timerInt);
  timerInt = setInterval(() => {
    const s = Math.floor((Date.now() - callStartTs) / 1000);
    timerEl.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }, 1000);
  // fresh call: clear stale guidance from any previous call
  assistEl.querySelectorAll(".card").forEach((c) => c.remove());
  liveCardIds.clear();
  document.getElementById("assistEmpty").style.display = "none";
}

function endCallUI() {
  callBanner.classList.remove("live");
  clearInterval(timerInt);
  interim = {};
  removeThinking();
  assistEl.querySelectorAll(".card").forEach((c) => c.classList.add("stale"));
  liveCardIds.clear();
  connText.textContent = "call ended";
}

// age out guidance cards so the rail stays relevant
setInterval(() => {
  const now = Date.now();
  assistEl.querySelectorAll(".card").forEach((c) => {
    const age = now - Number(c.dataset.ts || 0);
    if (age > CARD_REMOVE_MS) c.remove();
    else if (age > CARD_STALE_MS) c.classList.add("stale");
  });
}, 5000);

function setPaused(p) {
  paused = p;
  pauseBtn.classList.toggle("paused", p);
  pauseBtn.textContent = p ? "Paused" : "Pause";
}

function showThinking() {
  removeThinking();
  thinkingEl = document.createElement("div");
  thinkingEl.className = "thinking";
  thinkingEl.innerHTML = `<span class="shimmer"></span> Drafting a suggestion…`;
  assistEl.prepend(thinkingEl);
}
function removeThinking() { thinkingEl?.remove(); thinkingEl = null; }

const jumpBtn = document.getElementById("jump");
transcriptEl.addEventListener("scroll", () => {
  const nearBottom = transcriptEl.scrollHeight - transcriptEl.scrollTop - transcriptEl.clientHeight < 80;
  jumpBtn.style.display = nearBottom ? "none" : "block";
});
jumpBtn.onclick = () => transcriptEl.scrollTop = transcriptEl.scrollHeight;
function maybeScroll() {
  const nearBottom = transcriptEl.scrollHeight - transcriptEl.scrollTop - transcriptEl.clientHeight < 80;
  if (nearBottom) transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

function fmtTime(ts) {
  const d = new Date(ts);
  return `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}:${String(d.getSeconds()).padStart(2, "0")}`;
}

function renderTranscript(m) {
  if (!txHasContent) { transcriptEl.innerHTML = ""; txHasContent = true; }
  const key = m.speaker;
  if (!m.isFinal) {
    let el = interim[key];
    if (!el) { el = makeMsg(m, true); transcriptEl.appendChild(el); interim[key] = el; }
    el.querySelector(".bubble").textContent = m.text;
  } else {
    // promote the interim element in place -> no visual jump/overwrite
    const el = interim[key];
    if (el) {
      el.classList.remove("interim");
      el.querySelector(".bubble").textContent = m.text;
      el.querySelector(".meta").innerHTML =
        `${m.speaker === "caller" ? "Caller" : "You"}${m.language === "es" ? ' <span class="es-tag">ES</span>' : ""} · ${fmtTime(Date.now())}`;
      delete interim[key];
    } else {
      transcriptEl.appendChild(makeMsg(m, false));
    }
  }
  transcriptEl.querySelectorAll(".interim").forEach((n) => {
    if (!Object.values(interim).includes(n)) n.remove();
  });
  maybeScroll();
}

function makeMsg(m, isInterim) {
  const wrap = document.createElement("div");
  wrap.className = `msg ${m.speaker}` + (isInterim ? " interim" : "");
  const es = m.language === "es" ? `<span class="es-tag">ES</span>` : "";
  const time = isInterim ? "" : ` · ${fmtTime(Date.now())}`;
  wrap.innerHTML = `
    <div class="avatar">${m.speaker === "caller" ? "C" : "A"}</div>
    <div>
      <div class="meta">${m.speaker === "caller" ? "Caller" : "You"}${es}${time}</div>
      <div class="bubble"></div>
    </div>`;
  wrap.querySelector(".bubble").textContent = m.text;
  return wrap;
}

function renderSuggestion(s) {
  removeThinking();
  document.getElementById("assistEmpty")?.remove();
  const key = s.objectionId + "|" + s.title;
  if (liveCardIds.has(key)) return;   // server cooldown can still repeat across pipelines
  liveCardIds.add(key);
  const kind = s.kind || "objection";
  const card = document.createElement("div");
  card.className = `card ${kind}` + (s.escalate ? " escalate" : "");
  card.dataset.ts = Date.now();

  const sayBlock = s.response
    ? `<div class="say-label">You can say</div><div class="say"></div>`
    : `<div class="noanswer">No approved answer — escalate or take a message for the attorney.</div>`;
  const askBlock = s.followUp ? `<div class="ask"><b>Then ask:</b> <span class="fuTxt"></span></div>` : "";
  const escBadge = s.escalate ? `<span class="badge esc">Escalate</span>` : "";

  card.innerHTML = `
    <div class="top">
      <span class="badge">${KIND[kind] || "Assist"}</span>${escBadge}
      <h3></h3><span class="lang">${s.language}</span>
      <button class="dismiss" title="Dismiss">×</button>
    </div>
    ${sayBlock}${askBlock}
    <div class="foot">
      <div class="matched"></div>
      <div class="actions">
        <button class="fb helpful" title="This helped">Helpful</button>
        <button class="fb unhelpful" title="Not helpful">Not helpful</button>
        <button class="copy">Copy</button>
      </div>
    </div>`;

  card.querySelector("h3").textContent = s.title;
  card.querySelector(".say") && (card.querySelector(".say").textContent = s.response);
  card.querySelector(".fuTxt") && (card.querySelector(".fuTxt").textContent = s.followUp);
  card.querySelector(".matched").textContent = `"${s.matchedText}"`;
  card.querySelector(".dismiss").onclick = () => { card.remove(); liveCardIds.delete(key); };
  card.querySelector(".copy").onclick = () => {
    navigator.clipboard.writeText(s.response || s.title).catch(() => {});
  };
  for (const btn of card.querySelectorAll(".fb")) {
    btn.onclick = () => {
      const helpful = btn.classList.contains("helpful");
      card.querySelectorAll(".fb").forEach((b) => b.classList.remove("on"));
      btn.classList.add("on");
      ws.send(JSON.stringify({ type: "feedback", objectionId: s.objectionId, kind, helpful }));
    };
  }
  assistEl.prepend(card);
}
</script>
</body>
</html>
